<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multilingual email ticketing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ffffff;--panel:#ffffff;--ink:#10284a;--mute:#64748b;--line:#e2e8f0;--accent:#1e60b5;--accent-t:#ffffff;--soft:#f0f7ff;--stage1:#f8fafc;--stage2:#f1f5f9;--dot:transparent;--amber:#d97706;--amberbg:#fef3c7;--shadow:0 10px 30px -10px rgba(16,40,74,0.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ffffff;--panel:#ffffff;--ink:#10284a;--mute:#64748b;--line:#e2e8f0;--accent:#1e60b5;--accent-t:#ffffff;--soft:#f0f7ff;--stage1:#f8fafc;--stage2:#f1f5f9;--amber:#d97706;--amberbg:#fef3c7;--shadow:0 10px 30px -10px rgba(16,40,74,0.06)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font:14px/1.5 "Inter",system-ui,sans-serif;min-height:auto;padding:0}
.wrap{max-width:100%;margin:0 auto}
h1{margin:0 0 14px;text-align:center;font-size:clamp(28px,4.4vw,44px);line-height:1.15;font-weight:600;letter-spacing:-.025em}
.lead{margin:0 auto;text-align:center;max-width:62ch;color:var(--mute)}
.btns{display:flex;gap:12px;justify-content:center;margin:26px 0 40px}
.btn{font:inherit;font-weight:600;font-size:14px;padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
.panel{display:grid;grid-template-columns:260px 1fr;background:var(--panel);border:0;border-radius:0;box-shadow:none;overflow:hidden;min-height:550px;width:100%}
.tabs{display:flex;flex-direction:column;border-inline-end:1px solid var(--line);background:#ffffff}
.tab{position:relative;flex:1;text-align:start;font:inherit;font-weight:500;font-size:13.5px;padding:18px 22px;background:transparent;color:var(--mute);border:0;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.4;transition:background .2s,color .2s}
.tab:last-child{border-bottom:0}
.tab small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;color:#1e60b5;opacity:.85}
.tab.on{background:var(--soft);color:#1e60b5;font-weight:600}
.tab.on::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:#1e60b5}
.tab .bar{position:absolute;inset-inline:0;bottom:0;height:2px;background:#1e60b5;transform:scaleX(0);transform-origin:left}
.tab.on .bar.run{animation:fill 6s linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.stage{background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:18px}
.duo{display:flex;align-items:center;gap:14px}
.phone{width:262px;height:420px;flex:none;background:#ffffff;border:4px solid #10284a;border-radius:28px;box-shadow:0 14px 34px -10px rgba(16,40,74,0.18);display:flex;flex-direction:column;overflow:hidden}
.notch{height:20px;background:#10284a;display:grid;place-items:center}
.notch i{width:50px;height:4px;border-radius:9px;background:#ffffff;opacity:.35}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;background:#ffffff}
.sw{display:flex;background:var(--soft);border-radius:99px;padding:2px}
.sw button{font:inherit;font-size:11px;font-weight:600;border:0;background:transparent;color:var(--mute);padding:3px 10px;border-radius:99px;cursor:pointer}
.sw button.on{background:var(--accent);color:var(--accent-t)}
.pill{padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#10284a;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill.u{background:var(--amberbg);color:var(--amber)}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;background:#f8fafc}
.mail{display:flex;flex-direction:column;gap:4px;font-size:12px;background:#ffffff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.mail.mine{align-items:flex-end}.mail.theirs{align-items:flex-start}
.mail.new{animation:pop .3s ease-out}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #f1f5f9;color:var(--ink);font-size:12px;font-weight:600;width:100%}
.mail.mine .who{flex-direction:row-reverse;justify-content:flex-end}
.av{width:24px;height:24px;border-radius:50%;background:#3fae2a;color:#fff;border:2px solid #8bc34a;display:grid;place-items:center;font-weight:600;font-size:11px;flex:none}
.av.bot{background:#1e60b5;border-color:#3b82f6;font-size:12px}
.bub{max-width:none;padding:0;border-radius:0;background:none;white-space:pre-line;font-size:12.5px;line-height:1.5}
.bub.ar{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:13.5px}
mark{background:#e0f2fe;color:#0369a1;padding:0 3px;border-radius:3px;font-weight:600}
.tg{font-size:10px;font-weight:600;color:var(--accent);display:inline-block;margin-top:8px}
.at{display:table;margin-top:6px;padding:2px 8px;background:rgba(0,0,0,.06);border-radius:6px;font-size:10.5px;color:var(--mute);direction:ltr}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph small{display:block;color:var(--mute);font-size:10px;font-weight:400;line-height:1.2}
.ph b{font-size:12px}
.bridge{display:flex;flex-direction:column;align-items:center;gap:6px;width:58px;text-align:center;font-size:10.5px;font-weight:600;color:var(--accent)}
.bridge i{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pl .8s infinite alternate}
@keyframes pl{to{transform:scale(1.6);opacity:.5}}
.cap{max-width:52ch;text-align:center;color:var(--mute);font-size:13.5px;min-height:40px;margin:0}
@media (prefers-reduced-motion:reduce){.mail.new,.bridge i,.tab.on .bar.run{animation:none}}
@media (max-width:820px){.panel{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;border-inline-end:0;border-bottom:1px solid var(--line)}.tab{flex:none;min-width:190px;border-bottom:0;border-inline-end:1px solid var(--line)}.tab.on::before{inset-block:auto 0;inset-inline:0;width:auto;height:4px}.duo{flex-direction:column}.bridge{flex-direction:row;width:auto}.phone{width:min(300px,100%);height:340px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="tabs" id="tabs" role="tablist" aria-label="Email ticketing steps"></div>
    <div class="stage">
      <div class="duo">
        <div class="phone" role="region" aria-label="Customer mail in Arabic"><div class="notch"><i></i></div><div class="ph"><span><b>Customer mail</b><small>Arabic</small></span><span class="pill" id="plA"></span></div><div class="msgs" id="mA"></div></div>
        <div class="bridge" aria-hidden="true"><i></i><span>Live translation</span></div>
        <div class="phone" role="region" aria-label="Support engineer mail in English"><div class="notch"><i></i></div><div class="ph"><span><b>Support engineer mail</b><small>English</small></span><span class="pill" id="plE"></span></div><div class="msgs" id="mE" aria-live="polite"></div></div>
      </div>
      <p class="cap" id="cap"></p>
    </div>
  </div>
</div>
<script>
var P={c:{ar:'سارة الحربي',en:'Sara Al-Harbi',i:'S'},a:{ar:'دانيال من الدعم',en:'Daniel, Support',i:'D'}};
var S=[
{f:'c',ar:'مرحباً فريق الدعم،\nلا أستطيع تسجيل الدخول إلى لوحة التحكم منذ هذا الصباح. أرجو فتح تذكرة دعم.\nشكراً،\nسارة',en:'Hello Support team,\nI haven’t been able to log in to the dashboard since this morning. Please open a support ticket.\nThanks,\nSara'},
{f:'a',ar:'مرحباً سارة،\nنعتذر عن ذلك. لقد أنشأت التذكرة رقم 4821. هل يمكنك الرد بلقطة شاشة للخطأ؟\nمع التحية،\nدانيال',en:'Hi Sara,\nSorry about that. I’ve created ticket #4821. Could you reply with a screenshot of the error?\nBest,\nDaniel',st:'o'},
{f:'c',ar:'مرحباً دانيال،\nمرفق لقطة الشاشة. الأولوية عاجلة من فضلك.\nشكراً،\nسارة',en:'Hi Daniel,\nThe screenshot is attached. Please mark this as urgent.\nThanks,\nSara',att:1},
{f:'a',ar:'مرحباً سارة،\nتم. أصبحت التذكرة رقم 4821 عاجلة. سيرد عليك المهندس خلال 30 دقيقة.\nمع التحية،\nدانيال',en:'Hi Sara,\nDone. Ticket #4821 is now urgent. Our engineer will reply within 30 minutes.\nBest,\nDaniel',st:'u'}];
var T=[
['The customer sends a query in Arabic','The customer writes to support in Arabic, their own language.'],
['The support engineer receives the query in English and replies in English','The engineer reads the query in English and replies in English, without needing to know Arabic.'],
['The customer receives the reply in the language of the original query and responds','The reply reaches the customer in Arabic, the language they used, and they send a follow-up.'],
['The support engineer sends an immediate reply','The follow-up is translated instantly, so the engineer can reply right away.']];
var step=0,timer=null,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
var tabs=document.getElementById('tabs');
function el(t,c,x){var d=document.createElement(t);if(c)d.className=c;if(x)d.textContent=x;return d}
T.forEach(function(t,i){var b=el('button','tab');b.type='button';b.setAttribute('role','tab');b.appendChild(el('small','','Step '+(i+1)));b.appendChild(document.createTextNode(t[0]));b.appendChild(el('span','bar'));b.onclick=function(){stop();go(i)};tabs.appendChild(b)});
var HL={ar:['تسجيل الدخول','عاجلة','4821'],en:['log in','urgent','#4821']};
function fill(node,text,ar){
  var terms=HL[ar?'ar':'en'],re=new RegExp('('+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','i');
  text.split(re).forEach(function(part,i){if(!part)return;if(i%2){node.appendChild(el('mark','',part))}else{node.appendChild(document.createTextNode(part))}});
}
function build(box,pl,ar){
  var st=null;box.innerHTML='';
  for(var i=0;i<=step;i++){var m=S[i],p=P[m.f],own=ar?m.f==='c':m.f==='a',d=el('div','mail '+(own?'mine':'theirs')+(i===step?' new':'')),h=el('div','who');
    var av=el('span','av'+(m.f==='a'?' bot':''),m.f==='a'?'✦':p.i),nm=el('span','',m.f==='a'?(ar?'مهندس الدعم':'Support Engineer'):(ar?p.ar:p.en));
    if(own){h.appendChild(nm);h.appendChild(av)}else{h.appendChild(av);h.appendChild(nm)}
    d.appendChild(h);
    var b=el('div','bub'+(ar?' ar':''));fill(b,ar?m.ar:m.en,ar);
    if(m.att)b.appendChild(el('div','at',ar?'📎 لقطة_شاشة.png':'📎 screenshot.png'));
    b.appendChild(el('span','t',['10:42','10:44','10:46','10:47'][i]));
    d.appendChild(b);
    if(!own)d.appendChild(el('div','tg',ar?'مترجم من الإنجليزية':'Translated from Arabic'));
    box.appendChild(d);if(m.st)st=m.st}
  box.scrollTop=box.scrollHeight;
  pl.className='pill'+(st==='u'?' u':'');
  pl.textContent=!st?(ar?'بريد جديد':'New email'):(st==='u'?(ar?'#4821 · عاجلة':'#4821 · Urgent'):(ar?'#4821 · مفتوحة':'#4821 · Open'));
}
function render(){
  Array.prototype.forEach.call(tabs.children,function(b,i){b.classList.toggle('on',i===step);b.setAttribute('aria-selected',i===step);var bar=b.lastChild;bar.classList.remove('run');if(i===step&&timer){void bar.offsetWidth;bar.classList.add('run')}});
  build(document.getElementById('mA'),document.getElementById('plA'),true);
  build(document.getElementById('mE'),document.getElementById('plE'),false);
  document.getElementById('cap').textContent=T[step][1];
}
function go(i){step=i;render()}
function stop(){if(timer){clearInterval(timer);timer=null}}
if(!rm){timer=setInterval(function(){go((step+1)%T.length)},6000)}
render();
</script>
</body>
</html>
