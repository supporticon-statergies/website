<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting… | SupportIcon</title>
    <!-- Prevent search engines from indexing this redirect page -->
    <meta name="robots" content="noindex">
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License – https://github.com/rafgraph/spa-github-pages
      //
      // When GitHub Pages serves a 404, this script encodes the real path
      // into a query string and redirects to index.html, which decodes it
      // and replaces browser history so React Router sees the right URL.
      //
      // pathSegmentsToKeep:
      //   0  → custom domain (supporticon.com) – served from root
      //   1  → github.io project site (user.github.io/repo-name/)
      var pathSegmentsToKeep = 0;
      if (window.location.hostname.indexOf('github.io') !== -1) {
        // repo name is the first path segment after the leading slash
        var pathParts = window.location.pathname.split('/');
        if (pathParts.length > 1 && pathParts[1] !== '') {
          pathSegmentsToKeep = 1;
        }
      }

      var l = window.location;
      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var base   = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route  = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var query  = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      l.replace(origin + base + '/?/' + route + query + l.hash);
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
    <p>If you are not redirected automatically, <a href="/">click here</a>.</p>
  </body>
</html>
