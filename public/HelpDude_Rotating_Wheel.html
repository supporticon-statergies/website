<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpDude Features — Rotating Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html,body{
    margin:0;padding:0;
    background:transparent;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    font-family: 'Inter', sans-serif;
  }
  .stage{ width:min(900px, 96vw); }
  svg{ display:block; width:100%; height:auto; overflow:visible; font-family: 'Inter', sans-serif; }

  /* main ring: same motion as the original */
  #ringGroup{ will-change: transform; } /* rotation driven by script below */
  /* decorative outer scale turns slowly the other way */
  #scaleGroup{
    transform-box: view-box;
    transform-origin: 500px 530px;
    animation: spinRing 90s linear infinite reverse;
  }
  @keyframes spinRing{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }

  .seg{ transition: filter .25s ease; cursor: pointer; }
  .seg:hover{ filter: brightness(1.12) saturate(1.1); }
  .lbl{ pointer-events:none; letter-spacing:.2px; font-family: 'Inter', sans-serif !important; }

  @media (prefers-reduced-motion: reduce){
    #ringGroup, #scaleGroup{ animation:none; }
  }

  /* ---------- additions ---------- */
  /* gentle entrance */
  .stage{ animation: stageIn .9s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes stageIn{
    from{ opacity:0; transform: translateY(14px) scale(.985); }
    to  { opacity:1; transform: none; }
  }

  /* segment hover: crisp white outline on top of the existing brighten effect */
  .seg:hover{ stroke:#FFFFFF; stroke-width:5; }

  /* slow inner orbit ring inside the hub */
  #orbitGroup{
    transform-box: view-box;
    transform-origin: 500px 530px;
    animation: spinRing 60s linear infinite;
  }

  /* pointer marker: soft breathing glow */
  #pointerGlow{ animation: pointerPulse 2.6s ease-in-out infinite; }
  @keyframes pointerPulse{
    0%,100%{ opacity:.25; }
    50%    { opacity:.7; }
  }

  /* tagline + divider fade in after the wheel */
  #tagline{ animation: fadeUp 1s ease .5s both; }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(8px); }
    to  { opacity:1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .stage, #orbitGroup, #pointerGlow, #tagline{ animation:none; }
  }
</style>
</head>

<script>
(function(){
  var ring=document.getElementById('ringGroup');
  var flips=[].slice.call(document.querySelectorAll('.flip'));
  var PERIOD=22000;
  function draw(a){
    ring.setAttribute('transform','rotate('+a.toFixed(3)+' 500 530)');
    for(var i=0;i<flips.length;i++){
      var screen=(i*30+a)%360;                       // where this label is on screen (0 = top)
      flips[i].setAttribute('transform', (screen>90 && screen<270) ? 'rotate(180)' : 'rotate(0)');
    }
  }
  draw(0);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var t0=performance.now();
  (function tick(t){ draw(((t-t0)%PERIOD)/PERIOD*360); requestAnimationFrame(tick); })(t0);
})();
</script>
