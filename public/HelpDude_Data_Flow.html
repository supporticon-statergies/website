<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HelpDude — AI Support Ops</title>
<style>
  :root{
    --bg:#0a0e14;
    --card-bg:#11151d;
    --card-border:#242a35;
    --green:#8DC63F;
    --green-glow: rgba(141,198,63,0.55);
    --text-dim:#8b93a3;
    --text:#f2f4f7;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    height:100%;
  }
  .viewport{
    width:100%;
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    position:relative;
  }
  .stage{
    position:absolute;
    top:0; left:0;
    width:1140px;
    height:560px;
    margin:0;
    transform-origin:top left;
    background:
      radial-gradient(600px 340px at 50% 48%, rgba(141,198,63,0.06), transparent 70%),
      var(--bg);
  }

  svg.lines{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .flow-line{
    fill:none;
    stroke-width:2;
    stroke-dasharray:7 7;
    animation:dashmove 1.4s linear infinite;
    opacity:0.85;
  }
  @keyframes dashmove{
    to{ stroke-dashoffset:-28; }
  }

  .card{
    position:absolute;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 20px;
    width:300px;
    height:88px;
  }
  .card .icon{
    width:40px;height:40px;border-radius:50%;
    background:rgba(141,198,63,0.12);
    border:1px solid rgba(141,198,63,0.4);
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex-shrink:0;
    color:var(--green);
  }
  .card .label b{
    display:block;
    color:var(--text);
    font-size:16px;
    font-weight:700;
    margin-bottom:3px;
  }
  .card .label span{
    display:block;
    color:var(--text-dim);
    font-size:12.5px;
  }

  .center-card{
    position:absolute;
    left:420px; top:130px;
    width:300px; height:300px;
    background:linear-gradient(180deg,#141a12,#0f130d);
    border:1px solid rgba(141,198,63,0.55);
    border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    gap:10px;
    box-shadow:0 0 70px 6px var(--green-glow), inset 0 0 40px rgba(141,198,63,0.05);
  }
  .center-card .tagline{
    color:var(--text);
    font-size:22px;
    font-weight:800;
    line-height:1.35;
    max-width:230px;
  }
  .center-card .divider{
    width:60px;
    height:1px;
    background:rgba(141,198,63,0.4);
    margin:16px 0;
  }
  .center-card .brand{
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .center-card .brand img{
    width:44px;height:44px;
    object-fit:contain;
  }
  .center-card .brand b{
    color:var(--text);
    font-size:18px;
    font-weight:800;
    letter-spacing:0.5px;
  }

  .pill{
    position:absolute;
    width:300px;height:56px;
    border-radius:28px;
    display:flex;align-items:center;gap:12px;
    padding:0 22px;
    color:#fff;
    font-weight:700;
    font-size:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .pill .ic{
    width:24px;height:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
</style>
</head>

<script>
  function fitStage(){
    var viewport = document.getElementById('viewport');
    var stage = document.getElementById('stage');
    var w = viewport.clientWidth || window.innerWidth;
    var h = viewport.clientHeight || window.innerHeight;
    var scale = Math.min(w / 1140, h / 560);
    var offsetX = (w - 1140 * scale) / 2;
    var offsetY = (h - 560 * scale) / 2;
    stage.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  window.addEventListener('load', fitStage);
  fitStage();
</script>
